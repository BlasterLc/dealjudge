[project]
name = "dealjudge"
version = "0.1.0"
description = "An agent that judges whether a discount is real, using Strands Decider 2B"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.53.0",
    "boto3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
